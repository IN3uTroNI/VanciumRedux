 GER_vancea_blomberg_fritsch_desc:0 "Shocking revelations have rocked the German High Command. Field Marshal Werner von Blomberg has been forced to resign following revelations about his personal life, while Colonel-General Werner von Fritsch faces accusations questioning his loyalty to the Reich. The political fallout is immense, with whispers of purges and a reshuffling of command. The army’s stability hangs in The Führer's hands, either assume direct command of the Wehrmacht himself or place a highly trusted officer in charge of the OKW ."
